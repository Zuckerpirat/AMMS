# AMMS — Autonomous Trading Configuration

# ── Watchlist ──────────────────────────────────────────────────────────────
# Startsymbole. Der Bot erweitert diese Liste automatisch durch den
# Markt-Scanner (NASDAQ/NYSE, News, WSB). Nichts manuell hinzufügen nötig.
watchlist:
  - AAPL
  - MSFT
  - NVDA
  - AMZN
  - META
  - TSLA
  - AMD
  - MU

# ── Strategie ──────────────────────────────────────────────────────────────
strategy:
  name: decision_engine
  timeframe: 1Day
  params:
    min_score: 20              # Niedrig = aktiver (war 35). Score 0–100.
    min_confidence: 0.45       # 45% Indikator-Einigkeit reicht (war 0.60)
    mode: meme                 # Meme-Modus: Momentum + Volumen stark gewichtet

# ── Risiko-Management ──────────────────────────────────────────────────────
risk:
  max_open_positions: 10       # Bis zu 10 gleichzeitige Positionen
  max_position_pct: 0.08       # Max 8% pro Symbol
  daily_loss_pct: -0.05        # Stop-All bei -5% Tagesverlust
  max_buys_per_tick: 3         # Max 3 Käufe pro 5-Minuten-Tick

# ── Scheduler ──────────────────────────────────────────────────────────────
scheduler:
  tick_seconds: 300            # Alle 5 Minuten
  timezone: America/New_York
  tick_notify: orders_only     # Telegram nur bei echten Orders
