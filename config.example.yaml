# AMMS — Paper Trading Configuration
# Angepasst für Paper Trading. Alle Einstellungen konservativ gewählt.
# Ändere die Watchlist nach deinen Präferenzen.

# ── Watchlist ──────────────────────────────────────────────────────────────
# Symbole die der Bot beobachtet und traden darf.
# Der Auto-Scanner kann zusätzlich Symbole aus dem DEFAULT_UNIVERSE hinzufügen.
watchlist:
  - AAPL
  - MSFT
  - NVDA
  - AMZN
  - GOOGL
  - META
  - TSLA
  - AMD
  - JPM
  - V

# ── Strategie ──────────────────────────────────────────────────────────────
strategy:
  name: decision_engine        # Nutzt den zentralen Decision Engine (empfohlen)
  timeframe: 1Day              # Tages-Bars (stabiler als Intraday)
  params:
    min_score: 35              # Mindest-Score für Kauf-Signal (-100..+100)
    min_confidence: 0.60       # Mindest-Konfidenz (0..1)
    mode: swing                # Trading-Modus: conservative / swing / meme / event

# ── Risiko-Management ──────────────────────────────────────────────────────
risk:
  max_open_positions: 8        # Maximal 8 gleichzeitige Positionen
  max_position_pct: 0.10       # Max 10% des Portfolios pro Symbol
  daily_loss_pct: -0.03        # Stop-All bei -3% Tagesverlust
  max_buys_per_tick: 2         # Max 2 Käufe pro Tick (verhindert Overtrading)

# ── Scheduler ──────────────────────────────────────────────────────────────
scheduler:
  tick_seconds: 300            # Alle 5 Minuten einen Tick
  timezone: America/New_York
  tick_notify: orders_only     # Telegram nur bei echten Orders (kein Spam)
