{% set p = portfolio.top_loser %}
{% if p %}
    <div class="metric metric--negative">
        <div class="metric-value">{{ p.symbol }}</div>
        <div class="metric-sub">{{ p.unrealized_pl | signed }} $ · {{ p.unrealized_pl_pct | pct }}</div>
    </div>
{% else %}
    <div class="metric muted"><div class="metric-value">—</div><div class="metric-sub">keine Verlierer</div></div>
{% endif %}
