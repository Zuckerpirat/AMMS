<!DOCTYPE html>
<html lang="de" data-theme="claude">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AMMS Dashboard</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script>
        // Apply saved theme before paint to avoid a flash.
        (function () {
            try {
                const t = localStorage.getItem('amms-theme');
                if (t) document.documentElement.setAttribute('data-theme', t);
            } catch (e) { /* ignore */ }
        })();
    </script>
</head>
<body class="{% if edit_mode %}edit-mode{% endif %}">
    <header class="topbar">
        <div class="brand">
            <span class="brand-dot"></span>
            <span class="brand-name">AMMS</span>
            <span class="brand-tag">Paper Trading</span>
        </div>
        <div class="topbar-actions">
            <div id="live-indicator" class="live" title="Echtzeit-Aktualisierung aktiv">
                <span class="live-dot"></span>
                <span class="live-text">Live</span>
            </div>
            <div class="theme-switcher" role="group" aria-label="Farbthema">
                <button class="swatch swatch--claude" data-theme-set="claude" title="Claude — warm cremig"></button>
                <button class="swatch swatch--mocha" data-theme-set="mocha" title="Mocha — dunkel & warm"></button>
                <button class="swatch swatch--sage" data-theme-set="sage" title="Sage — ruhig grün"></button>
                <button class="swatch swatch--sunset" data-theme-set="sunset" title="Sunset — kräftig coral"></button>
            </div>
            {% if edit_mode %}
                <a class="btn btn--primary" href="/">Fertig</a>
            {% else %}
                <a class="btn btn--ghost" href="/?edit=1">Bearbeiten</a>
            {% endif %}
        </div>
    </header>

    {% if portfolio.is_demo %}
        <div class="banner">
            <strong>Demo-Modus.</strong> {{ portfolio.demo_reason }} — Du siehst Beispieldaten, damit das Dashboard sofort nutzbar ist.
        </div>
    {% endif %}

    <main id="grid" class="grid" data-edit="{{ '1' if edit_mode else '0' }}" data-refresh-ms="{{ refresh_ms }}">
        {% include "_grid.html" %}
    </main>

    <footer class="footer">
        <span>AMMS · lokal · paper only</span>
    </footer>

    <script src="/static/app.js"></script>
</body>
</html>
