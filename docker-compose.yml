services:
  amms:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: amms:dev
    container_name: amms
    env_file:
      - path: .env
        required: false
    volumes:
      - amms-data:/data
      - ./config.yaml:/app/config.yaml:ro
    environment:
      AMMS_CONFIG_PATH: /app/config.yaml
      AMMS_PAPER_STATE: /data/paper_portfolio.json
      AMMS_AUTOTRADER_STATE: /data/auto_trader_state.json
      AMMS_SIM_JOURNAL: /data/sim_journal.log
      AMMS_DB_PATH: /data/amms.sqlite
    command: ["simulate"]
    restart: unless-stopped

volumes:
  amms-data:
