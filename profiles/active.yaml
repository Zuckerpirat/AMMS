# Active profile — more frequent signals than swing, no intraday PDT lock.
#
# Composite strategy on 15-minute bars. Ticks every 5 minutes during US
# market hours. Positions may span overnight (min_hold_days=1), so the
# bot does NOT flatten before close and does NOT count as day-trading.
#
# Sizing is small (3% per position) because 15-min signals are noisier
# than daily ones. Stop-loss + trailing stop protect each trade.

watchlist:
  - AAPL
  - MSFT
  - NVDA
  - AMD
  - GOOGL
  - META
  - TSLA
  - AMZN
  - PLTR
  - SMCI
  - SOFI
  - COIN

strategy:
  name: composite
  timeframe: 15Min
  params:
    momentum_n: 20
    momentum_min: 0.01
    rsi_max: 75
    vol_max: 0.80
    rvol_min: 1.3
    sentiment_weight: 0.2

risk:
  max_open_positions: 6
  max_position_pct: 0.03
  daily_loss_pct: -0.03
  min_hold_days: 1
  max_buys_per_tick: 2
  stop_loss_pct: 0.05
  trailing_stop_pct: 0.10
  force_close_minutes_before_close: 0

universe:
  min_price: 2.00
  min_avg_dollar_volume: 5000000
  adv_lookback: 20
  require_tradable: true

scheduler:
  tick_seconds: 300
