# Niche profile — hunts outside the mega-caps.
#
# Base watchlist is mid/small-cap only (no AAPL/MSFT/NVDA — those are
# usually already in a human portfolio). WSB auto-discovery is ON by
# default and pulls the day's trending tickers from ApeWisdom (free, no
# API key) every 2 hours. Quality gate rejects pump-and-dump garbage
# (price <$2, ADV <$5M, non-tradable). Sentiment bonus active.
#
# Expect ~20–30 symbols on the effective watchlist after discovery,
# changing daily. Positions are small (3%) because these names move.

watchlist:
  # Mid-cap growth / high-interest names (NOT the Mag 7)
  - PLTR
  - SOFI
  - RIVN
  - LCID
  - HOOD
  - COIN
  - MARA
  - RIOT
  - AFRM
  - OPEN
  - CHWY
  - DKNG
  - BBAI
  - SOUN
  - ARM

strategy:
  name: composite
  timeframe: 15Min
  params:
    momentum_n: 20
    momentum_min: 0.01
    rsi_max: 75
    vol_max: 1.0
    rvol_min: 1.3
    sentiment_weight: 0.3     # WSB chatter boosts score 30%
    sentiment_min: -0.2       # block clearly bearish names

risk:
  max_open_positions: 8
  max_position_pct: 0.03
  daily_loss_pct: -0.04
  min_hold_days: 1
  max_buys_per_tick: 2
  stop_loss_pct: 0.06         # tighter — these are volatile
  trailing_stop_pct: 0.12
  force_close_minutes_before_close: 0

universe:
  min_price: 2.00             # no sub-$2 lottery tickets
  min_avg_dollar_volume: 5000000   # 20-day ADV >= $5M (real liquidity)
  adv_lookback: 20
  require_tradable: false     # Alpaca-specific; off in simulate mode

wsb_discovery:
  enabled: true               # ← this is the point of the niche profile
  top_n: 10                   # 10 trending tickers added to watchlist
  min_mentions: 5
  min_sentiment: -0.1
  refresh_hours: 2            # rescan every 2 hours
  subreddits:
    - wallstreetbets

scheduler:
  tick_seconds: 300
